<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farg'ona-Shohimardon Taksi</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #333; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        header { background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%); color: white; padding: 25px 0; text-align: center; border-radius: 0 0 20px 20px; box-shadow: 0 8px 25px rgba(255, 107, 107, 0.3); }
        .logo { font-size: 2.5rem; margin-bottom: 10px; font-weight: 700; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .booking-form { background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 20px; margin: 30px 0; box-shadow: 0 15px 40px rgba(0,0,0,0.15); backdrop-filter: blur(10px); }
        .form-group { margin-bottom: 25px; padding: 15px; border: 2px solid #e9ecef; border-radius: 15px; background: linear-gradient(145deg, #ffffff, #f8f9fa); transition: all 0.3s ease; }
        .form-group:hover { border-color: #ff6b6b; box-shadow: 0 5px 15px rgba(255, 107, 107, 0.2); }
        .form-group label { display: block; margin-bottom: 10px; font-weight: 600; color: #2c3e50; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; }
        select, input { width: 100%; padding: 12px 15px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; font-family: 'Poppins', sans-serif; transition: border-color 0.3s ease; }
        select:focus, input:focus { outline: none; border-color: #ff6b6b; box-shadow: 0 0 10px rgba(255, 107, 107, 0.2); }
        .time-group { display: flex; gap: 10px; }
        .time-group select { flex: 1; }
        .btn { background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%); color: white; padding: 15px; border: none; border-radius: 10px; width: 100%; cursor: pointer; font-size: 18px; font-weight: 600; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; transition: transform 0.3s ease; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3); }
        .location-btn { background: linear-gradient(135deg, #10ac84 0%, #0d8c6b 100%); color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; cursor: pointer; font-size: 16px; font-weight: 600; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; transition: transform 0.3s ease; }
        .location-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(16, 172, 132, 0.3); }
        footer { text-align: center; margin-top: 40px; color: #fff; padding: 20px; background: rgba(0,0,0,0.1); border-radius: 15px; }
        .location-status { background: linear-gradient(135deg, #fff3cd 0%, #ffeaa7 100%); color: #856404; padding: 10px; border-radius: 10px; margin: 10px 0; display: none; font-weight: 500; }
        .success { background: linear-gradient(135deg, #d4edda 0%, #a8e6cf 100%); color: #155724; padding: 15px; border-radius: 10px; margin: 15px 0; display: none; font-weight: 600; text-align: center; }
        .contact-number { font-size: 18px; font-weight: 700; color: white; margin: 10px 0; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        h1 { font-weight: 700; font-size: 2rem; margin-bottom: 5px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">🚗</div>
            <h1>Farg'ona-Shohimardon Taksi</h1>
            <p>Farg'ona viloyati barcha tumanlari va shaharlari o'rtasida tez va ishonchli taksi xizmati</p>
            <div class="contact-number">📞 +998 33 835 11 87</div>
        </div>
    </header>
    <div class="container">
        <div class="booking-form">
            <div class="form-group">
                <label>Qayerdan</label>
                <select id="pickup">
                    <option value="">Tanlang</option>
                    <option value="Farg'ona shahri">Farg'ona shahri</option>
                    <option value="Shohimardon">Shohimardon</option>
                    <option value="Toshloq">Toshloq</option>
                    <option value="Marg'ilon">Marg'ilon</option>
                    <option value="Oltiariq tumani">Oltiariq tumani</option>
                    <option value="Qo'shtepa tumani">Qo'shtepa tumani</option>
                    <option value="Buvayda tumani">Buvayda tumani</option>
                    <option value="Yozevon tumani">Yozevon tumani</option>
                    <option value="Furqat tumani">Furqat tumani</option>
                    <option value="Besharik tumani">Besharik tumani</option>
                    <option value="O'zbekiston tumani">O'zbekiston tumani</option>
                    <option value="Farg'ona tumani">Farg'ona tumani</option>
                    <option value="Kuva tumani">Kuva tumani</option>
                    <option value="Uchqo'prik tumani">Uchqo'prik tumani</option>
                    <option value="Rishton tumani">Rishton tumani</option>
                    <option value="Suv tumani">Suv tumani</option>
                    <option value="Bog'dod tumani">Bog'dod tumani</option>
                    <option value="Dang'ara tumani">Dang'ara tumani</option>
                    <option value="Quvasoy">Quvasoy</option>
                    <option value="Qo'qon shahri">Qo'qon shahri</option>
                </select>
            </div>
         
            <div class="form-group">
                <label>Qayerga</label>
                <select id="destination">
                    <option value="">Tanlang</option>
                    <option value="Farg'ona shahri">Farg'ona shahri</option>
                    <option value="Shohimardon">Shohimardon</option>
                    <option value="Toshloq">Toshloq</option>
                    <option value="Marg'ilon">Marg'ilon</option>
                    <option value="Oltiariq tumani">Oltiariq tumani</option>
                    <option value="Qo'shtepa tumani">Qo'shtepa tumani</option>
                    <option value="Buvayda tumani">Buvayda tumani</option>
                    <option value="Yozevon tumani">Yozevon tumani</option>
                    <option value="Furqat tumani">Furqat tumani</option>
                    <option value="Besharik tumani">Besharik tumani</option>
                    <option value="O'zbekiston tumani">O'zbekiston tumani</option>
                    <option value="Farg'ona tumani">Farg'ona tumani</option>
                    <option value="Kuva tumani">Kuva tumani</option>
                    <option value="Uchqo'prik tumani">Uchqo'prik tumani</option>
                    <option value="Rishton tumani">Rishton tumani</option>
                    <option value="Suv tumani">Suv tumani</option>
                    <option value="Bog'dod tumani">Bog'dod tumani</option>
                    <option value="Dang'ara tumani">Dang'ara tumani</option>
                    <option value="Quvasoy">Quvasoy</option>
                    <option value="Qo'qon shahri">Qo'qon shahri</option>
                </select>
            </div>
         
            <div class="form-group">
                <label>Necha kishi?</label>
                <input type="number" id="passengers" placeholder="Sonini yozing (masalan: 3)" min="1" max="10" required>
            </div>
            <div class="form-group">
                <label>Ketish sanasi</label>
                <input type="date" id="departureDate" required>
            </div>
            <div class="form-group">
                <label>Ketish vaqti</label>
                <div class="time-group">
                    <select id="hour" required>
                        <option value="">Soat</option>
                        <option value="00">00</option>
                        <option value="01">01</option>
                        <option value="02">02</option>
                        <option value="03">03</option>
                        <option value="04">04</option>
                        <option value="05">05</option>
                        <option value="06">06</option>
                        <option value="07">07</option>
                        <option value="08">08</option>
                        <option value="09">09</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                        <option value="13">13</option>
                        <option value="14">14</option>
                        <option value="15">15</option>
                        <option value="16">16</option>
                        <option value="17">17</option>
                        <option value="18">18</option>
                        <option value="19">19</option>
                        <option value="20">20</option>
                        <option value="21">21</option>
                        <option value="22">22</option>
                        <option value="23">23</option>
                    </select>
                    <select id="minute" required>
                        <option value="">Daqiqa</option>
                        <option value="0">00</option>
                        <option value="5">05</option>
                        <option value="10">10</option>
                        <option value="15">15</option>
                        <option value="20">20</option>
                        <option value="25">25</option>
                        <option value="30">30</option>
                        <option value="35">35</option>
                        <option value="40">40</option>
                        <option value="45">45</option>
                        <option value="50">50</option>
                        <option value="55">55</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Mashina turi</label>
                <select id="vehicleType" required>
                    <option value="">Tanlang</option>
                    <option value="Yengil">Yengil avtomobil</option>
                    <option value="Damas">Damas</option>
                </select>
            </div>
         
            <div class="form-group">
                <label>Telefon Raqam</label>
                <input type="tel" id="phone" placeholder="+998 XX XXX XX XX" required>
            </div>
         
            <div class="form-group">
                <label>Lokatsiya</label>
                <button type="button" class="location-btn" onclick="getLocation()">
                    📍 Lokatsiyani Yuborish
                </button>
                <div class="location-status" id="locationStatus">
                    Lokatsiya yuborilmadi
                </div>
            </div>
         
            <button class="btn" onclick="sendOrder()">🚕 Buyurtma Yuborish</button>
         
            <div class="success" id="successMessage">
                ✅ Buyurtmangiz qabul qilindi! Haydovchi tez orada bog'lanadi.
            </div>
        </div>
        <footer>
            <p class="contact-number">📞 +998 33 835 11 87</p>
            <p>⏰ 24/7 xizmat</p>
            <p>© 2026 Farg'ona-Shohimardon Taksi</p>
        </footer>
    </div>
    <script>
        // Bugungi sanani default qilish va min qo'yish
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('departureDate').value = today;
        document.getElementById('departureDate').min = today;

        let userLocation = null;
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        userLocation = {
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude
                        };
                        document.getElementById('locationStatus').style.display = 'block';
                        document.getElementById('locationStatus').innerHTML = '✅ Lokatsiya muvaffaqiyatli olindi!';
                        document.getElementById('locationStatus').style.background = 'linear-gradient(135deg, #d4edda 0%, #a8e6cf 100%)';
                        document.getElementById('locationStatus').style.color = '#155724';
                    },
                    function(error) {
                        document.getElementById('locationStatus').style.display = 'block';
                        document.getElementById('locationStatus').innerHTML = '❌ Lokatsiya olishda xatolik. Iltimos, qaytadan urinib ko\'ring.';
                    }
                );
            } else {
                document.getElementById('locationStatus').style.display = 'block';
                document.getElementById('locationStatus').innerHTML = '❌ Brauzeringiz lokatsiyani qo\'llab-quvvatlamaydi';
            }
        }
        function sendOrder() {
            const pickup = document.getElementById('pickup').value;
            const destination = document.getElementById('destination').value;
            const passengers = document.getElementById('passengers').value;
            const departureDate = document.getElementById('departureDate').value;
            const hour = document.getElementById('hour').value;
            const minute = document.getElementById('minute').value.padStart(2, '0');
            const vehicleType = document.getElementById('vehicleType').value;
            const phone = document.getElementById('phone').value;
            if(!pickup || !destination || !passengers || !departureDate || !hour || !minute || !vehicleType || !phone) {
                alert('❌ Iltimos, barcha maydonlarni to\'ldiring!');
                return;
            }
            if(pickup === destination) {
                alert('❌ Boshlanish va tugash nuqtalari bir xil bo\'lmasligi kerak!');
                return;
            }
            if(!userLocation) {
                alert('❌ Iltimos, avval lokatsiyangizni yuboring!');
                return;
            }
            // Vaqtni 24-soatlik formatda birlashtirish
            const timeStr = hour + ':' + minute;
            const departureDateTimeStr = `${departureDate}T${timeStr}`;
            const departureDateTime = new Date(departureDateTimeStr);
            // Telegram bot orqali yuborish
            const botToken = '7834547756:AAFU2oAnmwVhlw43Mfodm6AKAdPD4t5DoK0';
            const chatId = '-1002503400045';
         
            // Xabarda 24-soatlik format + davr
            const datePart = departureDateTime.toLocaleDateString('uz-UZ', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
            const hourNum = parseInt(hour);
            let period = '';
            if (hourNum < 12) {
                period = 'ertalab';
            } else if (hourNum < 18) {
                period = 'kunduzi';
            } else {
                period = 'kechqurun';
            }
            const formattedDateTime = `${datePart}, ${timeStr} (${period})`;
         
            const message = `🚕 YANGI BUYURTMA
📍 Qayerdan: ${pickup}
🎯 Qayerga: ${destination}
👥 Yo'lovchilar: ${passengers} kishi
🕒 Ketish sanasi va vaqti: ${formattedDateTime}
🚗 Mashina turi: ${vehicleType}
📞 Telefon: ${phone}
🌍 Lokatsiya:
   - Kenglik: ${userLocation.latitude}
   - Uzunlik: ${userLocation.longitude}
   - Xarita: https://maps.google.com/?q=${userLocation.latitude},${userLocation.longitude}
⏰ Buyurtma vaqti: ${new Date().toLocaleString('uz-UZ')}
💬 Narx va boshqa tafsilotlarni haydovchi bilan kelishib oling!`;
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message
                })
            })
            .then(response => response.json())
            .then(data => {
                if(data.ok) {
                    document.getElementById('successMessage').style.display = 'block';
                 
                    // Formani tozalash
                    document.getElementById('pickup').value = '';
                    document.getElementById('destination').value = '';
                    document.getElementById('passengers').value = '';
                    document.getElementById('departureDate').value = today;
                    document.getElementById('hour').value = '';
                    document.getElementById('minute').value = '';
                    document.getElementById('vehicleType').value = '';
                    document.getElementById('phone').value = '';
                    document.getElementById('locationStatus').style.display = 'none';
                    userLocation = null;
                 
                    setTimeout(() => {
                        document.getElementById('successMessage').style.display = 'none';
                    }, 5000);
                } else {
                    alert('❌ Buyurtma yuborishda xatolik: ' + data.description);
                }
            })
            .catch(error => {
                alert('❌ Internet aloqasi muammosi. Qaytadan urinib ko\'ring: ' + error.message);
            });
        }
        // Avtomatik to'ldirish
        document.getElementById('pickup').addEventListener('change', function() {
            if(this.value === 'Farg\'ona shahri') {
                document.getElementById('destination').value = 'Shohimardon';
            } else if(this.value === 'Shohimardon') {
                document.getElementById('destination').value = 'Farg\'ona shahri';
            }
        });
        document.getElementById('destination').addEventListener('change', function() {
            if(this.value === 'Farg\'ona shahri') {
                document.getElementById('pickup').value = 'Shohimardon';
            } else if(this.value === 'Shohimardon') {
                document.getElementById('pickup').value = 'Farg\'ona shahri';
            }
        });
    </script>
</body>
</html>
